<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Diagnostic Dashboard</title>

    <style>
        :root{
            --bg: #0e1116;
            --panel: #161b22;
            --panel-2: #1f2630;
            --border: #2d3540;
            --text: #e6edf3;
            --muted: #8b949e;
            --accent: #6495ed;
            --good: #3fb950;
            --bad: #f85149;
        }
        *{ box-sizing: border-box; }
        body{
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 24px 32px;
        }
        h1{
            margin: 0 0 24px;
            font-size: 1.8rem;
            letter-spacing: 0.5px;
        }
        h2{
            margin: 0 0 12px;
            font-size: 1.2rem;
            color: var(--accent);
        }
        .motors, .faults{
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 20px;
            width: fit-content;
            max-width: 100%;
            overflow-x: auto;
            margin-bottom: 24px;
        }
        table{
            border-collapse: separate;
            border-spacing: 0 6px;
        }
        th{
            text-align: left;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--muted);
            padding: 4px 14px;
        }
        td{
            background: var(--panel-2);
            padding: 10px 14px;
        }
        td:first-child{ border-radius: 8px 0 0 8px; font-weight: 600; }
        td:last-child{ border-radius: 0 8px 8px 0; }

        input[type="button"]{
            background: var(--border);
            color: var(--text);
            border: 1px solid transparent;
            border-radius: 6px;
            padding: 6px 14px;
            min-width: 92px;
            cursor: pointer;
            font-weight: 600;
        }
        input[type="button"]:hover{ border-color: var(--accent); }
        input[value="Enabled"]{ background: var(--good); color: #04130a; }
        input[value="Disabled"]{ background: var(--bad); color: #1a0505; }

        .slider-cell{
            display: flex;
            align-items: center;
            gap: 12px;
        }
        input[type="range"]{
            width: 200px;
            accent-color: var(--accent);
            cursor: pointer;
        }
        .slider-value{
            min-width: 4.5ch;
            text-align: right;
            font-variant-numeric: tabular-nums;
            color: var(--accent);
            font-weight: 600;
        }
    </style>
</head>
<body>
    <h1>Diagnostic Dashboard</h1>
    <div style="display:flex; flex-direction: row;">
        <div class="motors" style="margin-right:30px;">
            <h2>Motor Control</h2>
            <table id="data-table">
            </table>
        </div>

        <div class="faults">
            <h2>CAN Status</h2>
            <table id="can-table">
            </table>
        </div>
    </div>
    <script type="module" src="./index.js"></script>
</body>
</html>
